[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlcot"
version = "0.1.0"
description = "Stage-verifiable latent reasoning and dependency-aware local repair for robot manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4", "h5py==3.11.0", "Pillow==10.4.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
model = ["torch==2.2.2", "torchvision==0.17.2", "transformers==4.40.1", "tokenizers==0.19.1", "peft==0.11.1", "timm==0.9.10", "accelerate==0.30.1", "sentencepiece==0.2.0", "safetensors==0.4.3", "huggingface-hub==0.23.4"]
libero = ["robosuite==1.4.1", "mujoco==2.3.7", "bddl==1.0.1", "easydict==1.13", "gym==0.26.2", "opencv-python==4.10.0.84"]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[project.scripts]
vlcot = "vlcot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the optional PyTorch model dependencies; uses a tiny local backbone"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
