name: Manual checks

on:
  workflow_dispatch:
    inputs:
      include_model_tests:
        description: Run tiny CPU model tests without downloading weights
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install isolated core dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Install optional CPU tensor runtime
        if: inputs.include_model_tests
        run: .venv/bin/python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Core tests
        run: .venv/bin/python -m pytest -m 'not model'
      - name: Tiny model tests
        if: inputs.include_model_tests
        run: .venv/bin/python -m pytest tests/test_models.py
